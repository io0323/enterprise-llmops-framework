[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-llmops-framework"
version = "0.1.0"
description = "LLMOps Control Plane for PEP / APAP / Harness / DDE / CGMP"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
eval = ["jsonschema>=4.21"]
sdk-anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.scripts]
llmops = "llmops.cli:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# schema.sql と init の雛形はパッケージに同梱する(Prompt本文をPythonに書かないため。絶対ルール11)
llmops = ["db/*.sql", "templates/*.yaml", "templates/prompts/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/llmops"]

[[tool.mypy.overrides]]
# optional extra(`sdk-anthropic` / `eval`)。未インストール環境で型検査を落とさない。
# いずれも遅延 import し、未解決時は実行時にフォールバックまたは明示エラーにする
module = ["anthropic", "jsonschema"]
ignore_missing_imports = true

[tool.coverage.run]
# CLAUDE.md のカバレッジ規定は gateway / prompt / registry の3つ。計測対象をそこに絞る。
# llmops 全体を対象にすると、空のままのパッケージを埋めるためだけのテストを書く
# 圧力が生まれ、規定の意図から外れる(NOTES.md N-012)。
# Phase 2 で eval を追加した。評価基盤は「偽の合格を作らない」ことが仕事なので、
# 安全網の対象に入れる(NOTES.md N-035)。
source = ["llmops.gateway", "llmops.prompt", "llmops.registry", "llmops.eval"]

[tool.coverage.report]
fail_under = 80
show_missing = true
