# ELF 設定。閾値・上限はすべてここから読む(CLAUDE.md 絶対ルール12)。
system: elf                       # SDK利用時は LLMOps.load(system=...) が優先される

paths:
  db: "data/llmops.sqlite3"
  prompts_dir: "prompts"
  models_file: "models.yaml"
  evals_dir: "evals"
  report_dir: "output"

gateway:
  retry_max: 2                    # 初回+再試行。既存実装(max_retry:1)と等価
  default_model: chat-standard    # front matter にも呼び出しにも model が無いときの既定(論理名)
  timeout_sec: 600
  allow_unpublished: false        # true は開発時のみ。本番 true なら起動時に警告
  allow_raw_completion: false     # Registry管理外の呼び出し。移行期間のみ true
                                  # DDE / CGMP の Prompt 外部化が終わったので false へ戻した
  fallback_enabled: true

guard:
  calls_per_trace_limit: 10       # CGMP 絶対ルール3 を ELF 側で強制
  calls_per_trace_limit_by_system: # system 別の上書き。0 で無制限
    # DDE は「1ラン = 1 trace」で、1ランに expand / classify / cluster_naming が
    # 何十回も入る。記事単位の上限を持たないシステムなので上限を外す(NOTES.md N-023)
    dde: 0
  hard_quota: true

budget:
  global_monthly_usd: 20.0
  warn_percents: [50, 80, 100]
  # scope 別上限は `llmops budget set` で budgets テーブルへ登録する

trace:
  record_request_text: true       # 入出力全文記録(CGMP 絶対ルール8 を継承)
  record_response_text: true
  max_text_chars: 200000          # 超過分は末尾を切り truncated フラグを立てる
  strict: false                   # true で記録失敗を送出(テスト用。ELF_STRICT_TRACE でも可)

eval:
  judge_model: judge
  regression_tolerance: 0.02      # ベースライン比でこれを超える低下を regressed とする
  deterministic_first: true       # 決定的評価が落ちたら Judge を呼ばない

logging:
  level: INFO
  file: "logs/llmops.log"
