# 論理モデル定義。実モデル名・Provider製品名をここに書かない(CLAUDE.md 絶対ルール13)。
# 内容を変更すると config_hash が変わり、llmops sync が自動で新 version を採番する。
models:
  chat-standard:
    adapter: claude_cli
    params:
      command: ["claude", "-p", "--output-format", "json"]
      timeout_sec: 600
    price:
      # claude -p はサブスク実行のため単価0。実コストは span.cost_usd(応答の total_cost_usd)を正とする
      input_per_1k: 0.0
      output_per_1k: 0.0
    # fallback_to は設定しない。理由は NOTES.md N-026(mock へ落とすと偽の結果が返る)

  chat-fast:
    adapter: claude_cli
    params:
      command: ["claude", "-p", "--output-format", "json"]
      timeout_sec: 180
    price: {input_per_1k: 0.0, output_per_1k: 0.0}

  dde-batch:
    # DDE の 50件バッチ分類用。移行時に挙動を変えないため、
    # 既存 demand-discovery-engine/config.yaml の timeout_sec: 300 をそのまま踏襲する。
    adapter: claude_cli
    params:
      command: ["claude", "-p", "--output-format", "json"]
      timeout_sec: 300
    price: {input_per_1k: 0.0, output_per_1k: 0.0}
    # fallback_to は設定しない(N-026)

  judge:
    # 評価用。本番生成と分離しておく(自己評価バイアスの回避 / 将来の差し替え余地)
    adapter: claude_cli
    params:
      command: ["claude", "-p", "--output-format", "json"]
      timeout_sec: 300
    price: {input_per_1k: 0.0, output_per_1k: 0.0}

  chat-fallback:
    # Fallback 機構そのものの動作確認用。**本番モデルの fallback_to には指定しない**。
    # mock(echo)はプロンプトをそのまま返すため、JSON例を含むプロンプトだと
    # 「それらしい結果」が通ってしまう(NOTES.md N-026 で実際に起きた)
    adapter: mock
    params: {mode: echo}

  mock-echo:
    # 動作確認・テスト専用
    adapter: mock
    params: {mode: echo}

  # --- Harness(shopping-sns-auto-operation)--------------------------------
  # Harness は有料APIを使う唯一のシステム(docs/05 §4)。ELF が課金を増やすのではなく、
  # 既存の呼び出しを記録・制限するためにある(要件定義 §制約1)。
  # optional extra `sdk-anthropic` が入っている環境でのみ解決可能。
  #
  # - 実モデル名は環境変数から取る(絶対ルール13)。変数名は Harness の Settings
  #   (model_generator / model_evaluator / model_learning)と同じにしてある。
  #   Harness 側は .env の値を起動時に環境変数へ渡す(NOTES.md N-044)
  # - max_tokens は Harness の既存呼び出しを踏襲(learning だけ 2048)
  # - price は Harness の標準単価表と同じ値(USD / 1k tokens)。
  #   環境変数で実モデルを差し替えたら、ここも合わせて直すこと
  # - fallback_to は設定しない(N-026)。有料APIの代替先を黙って切り替えない
  harness-generator:
    adapter: anthropic_sdk
    params:
      model_env: MODEL_GENERATOR
      max_tokens: 1024
    price: {input_per_1k: 0.003, output_per_1k: 0.015}

  harness-evaluator:
    adapter: anthropic_sdk
    params:
      model_env: MODEL_EVALUATOR
      max_tokens: 1024
    price: {input_per_1k: 0.001, output_per_1k: 0.005}

  harness-learning:
    adapter: anthropic_sdk
    params:
      model_env: MODEL_LEARNING
      max_tokens: 2048
    price: {input_per_1k: 0.003, output_per_1k: 0.015}
